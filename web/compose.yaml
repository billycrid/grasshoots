name: grasshoots
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grasshoots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grasshoots_local}
      POSTGRES_DB: ${POSTGRES_DB:-grasshoots}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
